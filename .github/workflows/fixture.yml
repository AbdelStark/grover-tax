name: fixture

on:
  pull_request:
    paths:
      - "WORKLOAD.md"
      - "fixtures/**"
      - "docs/spec/schemas/**"
      - "python/grover_tax/**"
      - "python/tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/fixture.yml"
  push:
    branches: [main]

# Per RFC-0014 §"CI matrix" this file is the *standalone* fixture-side gate;
# the full project workflow lands with #48 (`ci.yml`) and re-uses these jobs.

jobs:
  workload-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workload pin must be filled
        run: bash scripts/check_workload.sh

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.18"
      - name: Install Python toolchain
        run: uv sync --frozen
      - name: Validate the canonical good fixture (regression guard)
        run: |
          uv run python -m grover_tax.validate_schemas \
            python/tests/fixtures/good/fixture_canonical.json
      - name: Validate `fixtures/v0.1.json` if present
        run: |
          if [[ -f fixtures/v0.1.json ]]; then
            uv run python -m grover_tax.validate_schemas fixtures/v0.1.json
          else
            echo "fixtures/v0.1.json not yet generated (issue #16 pending); skipping"
          fi

  gen-fixtures-check:
    runs-on: ubuntu-latest
    needs: workload-pin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.18"
      - name: Install Python toolchain
        run: uv sync --frozen
      - name: gen-fixtures --check (drift gate)
        run: |
          # Until #16 lands, `gen-fixtures` is an unimplemented entry point —
          # the binary exists (it's registered in pyproject.toml) but raises
          # at import time. CI tolerates that here: when the implementation
          # lands, this step starts producing real signal. Keep the job in
          # the matrix from day one so the gate doesn't get forgotten.
          if uv run gen-fixtures --check; then
            echo "gen-fixtures --check passed"
          else
            rc=$?
            if [[ $rc -eq 4 ]]; then
              echo "gen-fixtures --check exited 4 — fixture drift detected" >&2
              exit 4
            fi
            echo "gen-fixtures is not yet implemented (issue #16). Skipping until then." >&2
            exit 0
          fi

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.18"
      - name: Install Python toolchain
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check python/
      - name: mypy --strict
        run: uv run mypy --strict python/grover_tax
      - name: pytest
        run: uv run pytest python/tests -q
