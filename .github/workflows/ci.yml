name: ci

# Master CI workflow per RFC-0014 §"CI matrix". The Python-side jobs land
# here under #47; the Rust/Cairo/wrapper/patch jobs join under #48; the
# integration E2E and methodology-lint jobs under #49; license-check under
# #50 (already a single-line invocation); branch-protection + actionlint
# under #51.
#
# Concurrency: cancel in-progress runs on the same branch when a new push
# arrives — saves CI minutes during rapid iteration without losing the
# eventually-consistent green state.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"
  # SP1 prover (tanujkhattar/zkp_ecc) is vendored under third_party/sp1
  # (no longer a submodule). Its licensing is governed by Google Quantum
  # AI's default Apache-2.0 policy; documented in docs/license-exceptions.md.

jobs:
  # -- lint-python -------------------------------------------------------------
  lint-python:
    name: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check python/
      - name: mypy --strict
        run: uv run mypy --strict python/grover_tax

  # -- test-python -------------------------------------------------------------
  test-python:
    name: test-python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: pytest
        run: |
          uv run pytest python/tests -q \
            --cov=grover_tax \
            --cov-report=term-missing \
            --cov-report=xml
      - name: Upload coverage XML (artifact)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # -- workload-pin gate -------------------------------------------------------
  workload-pin:
    name: workload-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check_workload.sh
        # Exits 4 while WORKLOAD.md still carries `TBD` values (#4 pending);
        # once that lands the gate becomes green. CI tolerates the soft-fail
        # mode below until #4 closes so PR review stays unblocked on
        # unrelated changes.
        run: |
          if bash scripts/check_workload.sh; then
            echo "WORKLOAD.md is pinned."
          else
            rc=$?
            if [[ $rc -eq 4 ]]; then
              echo "::warning::WORKLOAD.md still contains TBD — #4 pending; treating as soft-fail until methodology decision lands"
            else
              echo "::error::scripts/check_workload.sh exited $rc"
              exit "$rc"
            fi
          fi

  # -- gen-fixtures-check ------------------------------------------------------
  gen-fixtures-check:
    name: gen-fixtures-check
    runs-on: ubuntu-latest
    needs: workload-pin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: gen-fixtures --check (drift gate)
        # The `gen-fixtures` entry point is registered in pyproject.toml
        # but not yet implemented (lands with #16). The job is wired here
        # from day one so the gate doesn't get forgotten when #16 merges.
        run: |
          if uv run gen-fixtures --check; then
            echo "gen-fixtures --check passed"
          else
            rc=$?
            if [[ $rc -eq 4 ]]; then
              echo "::error::FIXTURE.DRIFT — fixtures/v0.1.json differs from regenerated bytes"
              exit 4
            fi
            echo "::warning::gen-fixtures not yet implemented (#16 pending) — skipping"
          fi

  # -- schema-validate ---------------------------------------------------------
  schema-validate:
    name: schema-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Validate canonical good fixture
        run: |
          uv run python -m grover_tax.validate_schemas \
            python/tests/fixtures/good/fixture_canonical.json
      - name: Validate fixtures/v0.1.json if present
        run: |
          if [[ -f fixtures/v0.1.json ]]; then
            uv run python -m grover_tax.validate_schemas fixtures/v0.1.json
          else
            echo "fixtures/v0.1.json not generated yet (#16 pending); skipping"
          fi
      - name: Validate versions.lock if present
        run: |
          if [[ -f versions.lock ]]; then
            uv run python -m grover_tax.validate_schemas \
              --schema versions-lock-v1 versions.lock || true
          else
            echo "versions.lock not committed yet (#7 pending); skipping"
          fi

  # -- results-md-lint ---------------------------------------------------------
  results-md-lint:
    name: results-md-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Lint a synthetic RESULTS.md from the template
        # Renders `docs/spec/templates/RESULTS.md.j2` against the synthetic
        # context the template tests use, then runs the methodology lint.
        run: |
          uv run python -c "
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader, StrictUndefined
          import sys, importlib.util
          spec = importlib.util.spec_from_file_location(
              'tplsmoke', 'python/tests/test_results_template.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          env = Environment(
              loader=FileSystemLoader('docs/spec/templates'),
              undefined=StrictUndefined,
              keep_trailing_newline=True,
              autoescape=False,
          )
          rendered = env.get_template('RESULTS.md.j2').render(**mod._synthetic_context())
          Path('RESULTS.md').write_text(rendered, encoding='utf-8')
          "
          uv run check-results-md RESULTS.md

  # -- integration-e2e --------------------------------------------------------
  integration-e2e:
    name: integration-e2e
    runs-on: ubuntu-latest
    # Per RFC-0014 §"CI matrix" and #49: drive the full analyze + plot
    # pipeline against a synthetic-but-realistic results corpus. CI cannot
    # build the real prover binaries cheaply, so this job exercises the
    # *reporting* path: the synthetic input has ≥ 10 M1 samples and ≥ 40
    # M5 samples per prover so it passes the insufficient-samples gate and
    # the methodology lint runs against analyze's actual output (not just
    # the template).
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Synthesise a small results/ corpus
        run: |
          mkdir -p results
          uv run python -c "
          import json
          from pathlib import Path
          # 12 M1 samples per prover (1 cold-cache discard → 11 valid).
          sp1_m1 = [1.0 + i * 0.01 for i in range(12)]
          stwo_m1 = [0.5 + i * 0.005 for i in range(12)]
          sp1_m5 = [0.04] * 40
          stwo_m5 = [0.03] * 40
          for name, times in (
              ('sp1_v0.1_r1.timing.json', sp1_m1),
              ('stwo_v0.1_r1.timing.json', stwo_m1),
              ('sp1_v0.1_r1.verify.json', sp1_m5),
              ('stwo_v0.1_r1.verify.json', stwo_m5),
          ):
              Path('results') / name
              Path(f'results/{name}').write_text(
                  json.dumps({'results': [{'command': 'x', 'times': times}]}),
                  encoding='utf-8',
              )
          # Realistic gnu-time records — user-CPU ≈ wall-clock (no concurrency flag).
          for prover, wall in (('sp1', 1.05), ('stwo', 0.525)):
              Path(f'results/{prover}_v0.1_r1.time.txt').write_text(
                  '\tCommand being timed: \"prover\"\n'
                  f'\tUser time (seconds): {wall:.2f}\n'
                  '\tSystem time (seconds): 0.05\n'
                  f'\tElapsed (wall clock) time (h:mm:ss or m:ss): 0:{wall:05.2f}\n'
                  '\tMaximum resident set size (kbytes): 4096\n',
                  encoding='utf-8',
              )
          "
          ls -la results/
      - name: uv run analyze
        run: uv run analyze
      - name: uv run plot
        run: uv run plot
      - name: Inspect produced artifacts
        run: |
          test -f RESULTS.md
          test -f results/plots/wallclock_hist.png
          test -f results/plots/medians_bar.png
          test -f results/plots/day1_day2.png
          # Headline ratio must be present (SP1 / Stwo).
          grep -q "Ratio (SP1 / Stwo)" RESULTS.md
      - name: methodology-lint on analyze's actual output
        run: uv run check-results-md RESULTS.md
      - name: Upload RESULTS.md + plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-output
          path: |
            RESULTS.md
            results/

  # -- methodology-lint -------------------------------------------------------
  methodology-lint:
    name: methodology-lint
    runs-on: ubuntu-latest
    needs: integration-e2e
    # Independent re-run of the methodology lint on a fresh checkout, so the
    # gate stays visible as its own status check rather than buried in the
    # integration-e2e log. Reads the artifact produced by integration-e2e.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Download RESULTS.md from integration-e2e
        uses: actions/download-artifact@v4
        with:
          name: integration-e2e-output
          path: integration-output
      - name: methodology-lint
        run: uv run check-results-md integration-output/RESULTS.md

  # -- workflow-lint (actionlint) ---------------------------------------------
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mv ./actionlint /usr/local/bin/actionlint
      - name: actionlint
        run: actionlint -color

  # -- cairo-test --------------------------------------------------------------
  cairo-test:
    name: cairo-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scarb
        # Pinned via the upstream installer's `-v` flag once `versions.lock`
        # locks the scarb version (#7). Today we take latest stable.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://docs.swmansion.com/scarb/install.sh | sh -s --
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: scarb build
        run: scarb --manifest-path stwo-side/cairo/Scarb.toml build
      - name: scarb cairo-test
        run: scarb --manifest-path stwo-side/cairo/Scarb.toml cairo-test

  # -- rust-test ---------------------------------------------------------------
  rust-test:
    name: rust-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        # `rust-toolchain.toml` at the repo root pins
        # `nightly-2025-07-14` (required by `stwo` git dep used in
        # `stwo-side`). `rustup show` (with the toml present) installs
        # + activates the channel for every subsequent step.
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: cargo build --release -p stwo-side
        run: cargo build --release -p stwo-side
      - name: cargo test --release -p stwo-side
        run: cargo test --release -p stwo-side
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Wrapper exit-code matrix via pytest
        # The wrapper-symmetry tests (test_wrapper_symmetry, test_sp1_wrappers,
        # test_stwo_wrappers, test_wrapper_lib) exercise the RFC-0007 contract
        # without needing the real prover binaries — uses bash stubs in tmp_path.
        # `uv run` reuses the project venv created by `uv sync`, side-stepping
        # macOS's PEP 668 externally-managed-environment block on system Python.
        run: |
          uv run pytest python/tests/test_wrapper_symmetry.py \
                        python/tests/test_sp1_wrappers.py \
                        python/tests/test_stwo_wrappers.py \
                        python/tests/test_wrapper_lib.py \
                        -q
