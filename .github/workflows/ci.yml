name: ci

# Master CI workflow per RFC-0014 §"CI matrix". The Python-side jobs land
# here under #47; the Rust/Cairo/wrapper/patch jobs join under #48; the
# integration E2E and methodology-lint jobs under #49; license-check under
# #50 (already a single-line invocation); branch-protection + actionlint
# under #51.
#
# Concurrency: cancel in-progress runs on the same branch when a new push
# arrives — saves CI minutes during rapid iteration without losing the
# eventually-consistent green state.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"
  # `sp1-side` (tanujkhattar/zkp_ecc) does not ship a LICENSE file in
  # its tree; the redistribution is governed by Google Quantum AI's
  # default Apache-2.0 policy. Documented in
  # docs/license-exceptions.md.
  LICENSE_SUBMODULE_EXCEPTIONS: "sp1-side"

jobs:
  # -- lint-python -------------------------------------------------------------
  lint-python:
    name: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check python/
      - name: mypy --strict
        run: uv run mypy --strict python/grover_tax

  # -- test-python -------------------------------------------------------------
  test-python:
    name: test-python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: pytest
        run: |
          uv run pytest python/tests -q \
            --cov=grover_tax \
            --cov-report=term-missing \
            --cov-report=xml
      - name: Upload coverage XML (artifact)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # -- workload-pin gate -------------------------------------------------------
  workload-pin:
    name: workload-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check_workload.sh
        # Exits 4 while WORKLOAD.md still carries `TBD` values (#4 pending);
        # once that lands the gate becomes green. CI tolerates the soft-fail
        # mode below until #4 closes so PR review stays unblocked on
        # unrelated changes.
        run: |
          if bash scripts/check_workload.sh; then
            echo "WORKLOAD.md is pinned."
          else
            rc=$?
            if [[ $rc -eq 4 ]]; then
              echo "::warning::WORKLOAD.md still contains TBD — #4 pending; treating as soft-fail until methodology decision lands"
            else
              echo "::error::scripts/check_workload.sh exited $rc"
              exit "$rc"
            fi
          fi

  # -- gen-fixtures-check ------------------------------------------------------
  gen-fixtures-check:
    name: gen-fixtures-check
    runs-on: ubuntu-latest
    needs: workload-pin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: gen-fixtures --check (drift gate)
        # The `gen-fixtures` entry point is registered in pyproject.toml
        # but not yet implemented (lands with #16). The job is wired here
        # from day one so the gate doesn't get forgotten when #16 merges.
        run: |
          if uv run gen-fixtures --check; then
            echo "gen-fixtures --check passed"
          else
            rc=$?
            if [[ $rc -eq 4 ]]; then
              echo "::error::FIXTURE.DRIFT — fixtures/v0.1.json differs from regenerated bytes"
              exit 4
            fi
            echo "::warning::gen-fixtures not yet implemented (#16 pending) — skipping"
          fi

  # -- schema-validate ---------------------------------------------------------
  schema-validate:
    name: schema-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Validate canonical good fixture
        run: |
          uv run python -m grover_tax.validate_schemas \
            python/tests/fixtures/good/fixture_canonical.json
      - name: Validate fixtures/v0.1.json if present
        run: |
          if [[ -f fixtures/v0.1.json ]]; then
            uv run python -m grover_tax.validate_schemas fixtures/v0.1.json
          else
            echo "fixtures/v0.1.json not generated yet (#16 pending); skipping"
          fi
      - name: Validate versions.lock if present
        run: |
          if [[ -f versions.lock ]]; then
            uv run python -m grover_tax.validate_schemas \
              --schema versions-lock-v1 versions.lock || true
          else
            echo "versions.lock not committed yet (#7 pending); skipping"
          fi

  # -- results-md-lint ---------------------------------------------------------
  results-md-lint:
    name: results-md-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Lint a synthetic RESULTS.md from the template
        # Renders `docs/spec/templates/RESULTS.md.j2` against the synthetic
        # context the template tests use, then runs the methodology lint.
        run: |
          uv run python -c "
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader, StrictUndefined
          import sys, importlib.util
          spec = importlib.util.spec_from_file_location(
              'tplsmoke', 'python/tests/test_results_template.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          env = Environment(
              loader=FileSystemLoader('docs/spec/templates'),
              undefined=StrictUndefined,
              keep_trailing_newline=True,
              autoescape=False,
          )
          rendered = env.get_template('RESULTS.md.j2').render(**mod._synthetic_context())
          Path('RESULTS.md').write_text(rendered, encoding='utf-8')
          "
          uv run check-results-md RESULTS.md

  # -- workflow-lint (actionlint) ---------------------------------------------
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mv ./actionlint /usr/local/bin/actionlint
      - name: actionlint
        run: actionlint -color

  # -- sp1-patch-budget --------------------------------------------------------
  sp1-patch-budget:
    name: sp1-patch-budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RFC-0006 line-budget gate (50 .rs / 5 Cargo.toml)
        run: bash scripts/check_sp1_patch_budget.sh

  # -- sp1-patch-clean-apply ---------------------------------------------------
  sp1-patch-clean-apply:
    name: sp1-patch-clean-apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply SP1 patches against pinned sp1-side
        # Soft-fail while the patch is still a structural sketch (#25's
        # caveat — SHAs / context need a real `git format-patch -1`
        # refresh on the reference rig). Becomes a hard gate the moment
        # the patch is refreshed.
        run: |
          if bash scripts/apply_sp1_patch.sh; then
            echo "apply_sp1_patch: clean apply"
          else
            rc=$?
            if [[ $rc -eq 3 ]]; then
              echo "::warning::SP1 patch needs a format-patch -1 refresh on the reference rig (#25 caveat); soft-fail"
            else
              echo "::error::apply_sp1_patch.sh exited $rc"
              exit "$rc"
            fi
          fi
