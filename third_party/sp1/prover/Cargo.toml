[package]
version = "0.1.0"
name = "zkp_ecc-prover"
edition = "2021"
default-run = "prove"

[[bin]]
name = "prove"
path = "prove.rs"

[dependencies]
sp1-sdk = { version = "6.0.2", features = ["blocking", "native-gnark"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"

[build-dependencies]
sp1-build = { version = "6.0.2" }
