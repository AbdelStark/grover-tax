[package]
name = "stwo-side"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stwo prover and verifier binaries for grover-tax v0.1."
repository = "https://github.com/AbdelStark/grover-tax"
publish = false

# Two thin binaries per RFC-0007 §"`bin/run_<prover>.sh`" + the Stwo verifier
# contract. Both invoke real Stwo proving on an AIR sized to the fixture's
# `gate_count`. The wrappers in `bin/run_stwo.sh` / `bin/verify_stwo.sh` are
# the operator-facing surface; these binaries are the strict argv contract
# they invoke.

[[bin]]
name = "stwo_prove"
path = "src/bin/prover_main.rs"

[[bin]]
name = "stwo_verify"
path = "src/bin/verifier_main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
hex = "0.4"
itertools = "0.12"
num-traits = "0.2"
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "cca98119f4641c3e096de74b915c1aa55453bcad", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "cca98119f4641c3e096de74b915c1aa55453bcad", features = ["prover"] }

[lints]
workspace = true
